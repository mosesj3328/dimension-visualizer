<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>4D Hypersphere Visualizer</title>
		<style>
			body { margin: 0; }
			canvas { display: block; }
			#slider-container {
				position: absolute;
				top: 20px;
				left: 20px;
				color: white;
			}
		</style>
	</head>
	<body>
		<div id="slider-container">
			<span id="w-slider-group" style="display: inline-block;">
				<label for="w-slider">W-Dimension Slice:</label>
				<input type="range" id="w-slider" min="-2" max="2" value="0" step="0.01">
			</span>
			<button id="toggle-mode">Toggle Mode</button>
			<br>
			<label for="xw-slider">XW Rotation:</label>
			<input type="range" id="xw-slider" min="-3.14" max="3.14" value="0" step="0.01">
			<label for="yw-slider">YW Rotation:</label>
			<input type="range" id="yw-slider" min="-3.14" max="3.14" value="0" step="0.01">
			<label for="zw-slider">ZW Rotation:</label>
			<input type="range" id="zw-slider" min="-3.14" max="3.14" value="0" step="0.01">
		</div>
		<script type="module" src="main.js"></script>
	</body>
</html>
